plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file("key.properties")
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream {
        releaseSigningProperties.load(it)
    }
}

def signingValue = { String environmentName, String propertyName ->
    def environmentValue = System.getenv(environmentName)
    return environmentValue ?: releaseSigningProperties.getProperty(propertyName)
}
def releaseStorePath = signingValue("ANDROID_KEYSTORE_PATH", "storeFile")
def releaseStorePassword = signingValue("ANDROID_KEYSTORE_PASSWORD", "storePassword")
def releaseKeyAlias = signingValue("ANDROID_KEY_ALIAS", "keyAlias")
def releaseKeyPassword = signingValue("ANDROID_KEY_PASSWORD", "keyPassword")
def releaseStoreFile = releaseStorePath ? rootProject.file(releaseStorePath) : null
def releaseSigningConfigured = releaseStoreFile?.isFile()
        && releaseStorePassword
        && releaseKeyAlias
        && releaseKeyPassword

android {
    namespace = "com.quiz.quiz"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.quiz.quiz"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    flavorDimensions += "distribution"
    productFlavors {
        global {
            dimension "distribution"
            buildConfigField "String", "APP_DISTRIBUTION", '"global"'
        }
        china {
            dimension "distribution"
            buildConfigField "String", "APP_DISTRIBUTION", '"china"'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile = releaseStoreFile
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

def chinaExcludedDependencyGroups = [
    "com.android.billingclient",
    "com.google.android.gms",
    "com.google.android.play",
    "com.google.android.ump",
    "com.google.firebase",
    "com.revenuecat.purchases",
]

configurations.configureEach { configuration ->
    if (configuration.name.toLowerCase().startsWith("china")) {
        chinaExcludedDependencyGroups.each { groupName ->
            configuration.exclude group: groupName
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("processChina") && task.name.endsWith("GoogleServices")) {
        task.enabled = false
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def requestedTasks = gradle.startParameter.taskNames.collect {
        it.toLowerCase()
    }
    def buildsChina = requestedTasks.any { taskName ->
        taskName.contains("china")
    }
    if (buildsChina && !project.hasProperty("chinaGmsFree")) {
        throw new GradleException(
            "China artifacts must be built with scripts/build_china_android.sh"
        )
    }
    def buildsRelease = requestedTasks.any { taskName ->
        taskName.contains("release")
    }
    if (buildsRelease && !releaseSigningConfigured) {
        throw new GradleException(
            "Android release signing is not configured. " +
            "Copy android/key.properties.example to android/key.properties " +
            "or provide the ANDROID_KEYSTORE_* environment variables."
        )
    }
}

flutter {
    source = "../.."
}
