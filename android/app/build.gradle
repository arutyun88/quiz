plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.quiz.quiz"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.quiz.quiz"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    flavorDimensions += "distribution"
    productFlavors {
        global {
            dimension "distribution"
            buildConfigField "String", "APP_DISTRIBUTION", '"global"'
        }
        china {
            dimension "distribution"
            buildConfigField "String", "APP_DISTRIBUTION", '"china"'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

def chinaExcludedDependencyGroups = [
    "com.android.billingclient",
    "com.google.android.gms",
    "com.google.android.play",
    "com.google.android.ump",
    "com.google.firebase",
    "com.revenuecat.purchases",
]

configurations.configureEach { configuration ->
    if (configuration.name.toLowerCase().startsWith("china")) {
        chinaExcludedDependencyGroups.each { groupName ->
            configuration.exclude group: groupName
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("processChina") && task.name.endsWith("GoogleServices")) {
        task.enabled = false
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def buildsChina = gradle.startParameter.taskNames.any { taskName ->
        taskName.toLowerCase().contains("china")
    }
    if (buildsChina && !project.hasProperty("chinaGmsFree")) {
        throw new GradleException(
            "China artifacts must be built with scripts/build_china_android.sh"
        )
    }
}

flutter {
    source = "../.."
}
