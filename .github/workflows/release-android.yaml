name: Android release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build signed artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
      POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          cache: true

      - name: Validate production secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            ANDROID_SIGNING_CERT_SHA256
            POSTHOG_PROJECT_TOKEN
            SENTRY_DSN
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare signing key and build configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keystore_path="$RUNNER_TEMP/eruday-release.jks"
          defines_path="$RUNNER_TEMP/production-defines.json"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          jq -n \
            --arg posthog "$POSTHOG_PROJECT_TOKEN" \
            --arg sentry "$SENTRY_DSN" \
            '{
              POSTHOG_PROJECT_TOKEN: $posthog,
              SENTRY_DSN: $sentry,
              SENTRY_ENVIRONMENT: "production"
            }' > "$defines_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "PRODUCTION_DEFINES_PATH=$defines_path" >> "$GITHUB_ENV"

      - name: Build Global app bundle
        run: >-
          scripts/build_global_android.sh
          --dart-define-from-file="$PRODUCTION_DEFINES_PATH"

      - name: Build China APK
        run: >-
          scripts/build_china_android.sh
          --release
          --dart-define-from-file="$PRODUCTION_DEFINES_PATH"

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release
          cp build/app/outputs/bundle/globalRelease/app-global-release.aab \
            build/release/eruday-global.aab
          cp build/app/outputs/flutter-apk/app-china-release.apk \
            build/release/eruday-china.apk
          cd build/release
          sha256sum eruday-global.aab eruday-china.apk > SHA256SUMS

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.run_number }}
          path: build/release/
          if-no-files-found: error
          retention-days: 14
